# Assistants de sistema desta instalação (spec 003, assistants-yaml.md). Montado em runtime, somente leitura.
assistants:
  scouting:
    visibility: public
    auth:
      schemes: [oidc, api_key]
      allow: ["*"]
    # Sem `flow`: roda no preferido do pack, rag_first (spec 101 US5); a coleção scouting libera a tool de busca.
    packs: [scouting]
    collections: [scouting]
    models:
      generation: openrouter/~z-ai/glm-flash-latest
      allow: ["openrouter/*"]
  geral:
    visibility: public
    auth:
      schemes: [oidc, api_key]
      allow: ["*"]
    flow: agentic
    packs: [generic]
    models:
      generation: openrouter/~z-ai/glm-flash-latest
      controller: openrouter/~z-ai/glm-flash-latest
      allow: ["openrouter/*"]
api_keys:
  admin_group: admin
