# Packs habilitados nesta instalação (spec 002, packs-yaml.md). Vai para a imagem: o build valida exatamente o que roda
# (research R24). Trocar um pack é mudar PACKS (build-arg) e este arquivo, e rebuildar.
packs:
  generic:
    enabled: true
  scouting:
    enabled: true
    # Configuração do pack (spec 101, research R18), validada pelo config_schema no boot e no `packs check` do build.
    # A chave do Qdrant, quando houver, vem só de AXON_SCOUTING_QDRANT_API_KEY (.env), nunca daqui.
    config:
      qdrant_url: http://qdrant:6333
      embedding_dir: /opt/axon-scouting/e5-small
