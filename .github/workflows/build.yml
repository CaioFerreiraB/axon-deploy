# CI da instalação (spec 002 US5; research R27, R28): o Independent Test a cada push.
# Cada identidade SSH do build usa a deploy key só de leitura do repositório que ela lê.
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Gravar as deploy keys
        env:
          AGENTIC_APP_DEPLOY_KEY: ${{ secrets.AGENTIC_APP_DEPLOY_KEY }}
          AI_SCOUTING_DEPLOY_KEY: ${{ secrets.AI_SCOUTING_DEPLOY_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/keys"
          printf '%s\n' "$AGENTIC_APP_DEPLOY_KEY" > "$RUNNER_TEMP/keys/core"
          printf '%s\n' "$AI_SCOUTING_DEPLOY_KEY" > "$RUNNER_TEMP/keys/packs"
          chmod 600 "$RUNNER_TEMP/keys/core" "$RUNNER_TEMP/keys/packs"
      - name: Independent Test da US5
        env:
          SSH_CORE: ${{ runner.temp }}/keys/core
          SSH_PACKS: ${{ runner.temp }}/keys/packs
        run: scripts/check-build.sh
      - name: Apagar as chaves
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
