# Prova da referência (spec 002 US5; ADR-042): a cada PR e push, as imagens base de uma tag do axon e, sobre elas, o
# modelo de instalação — com o generic e com o pack incompatível. Nada é publicado aqui (ver images.yml).
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # O driver docker: o modelo de instalação é construído FROM as imagens base do armazenamento local.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Gravar a deploy key do axon
        env:
          AGENTIC_APP_DEPLOY_KEY: ${{ secrets.AGENTIC_APP_DEPLOY_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/keys"
          printf '%s\n' "$AGENTIC_APP_DEPLOY_KEY" > "$RUNNER_TEMP/keys/core"
          chmod 600 "$RUNNER_TEMP/keys/core"
      - name: Independent Test da US5
        env:
          SSH_CORE: ${{ runner.temp }}/keys/core
        run: scripts/check-build.sh
      - name: Apagar as chaves
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
