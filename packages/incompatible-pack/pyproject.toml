# Pack de teste da US5 cen. 2 (spec 002, research R26, R58): instala sobre os contratos 0.2 (a faixa aceita), mas
# declara `contract_version = "0.3"` — o `axon packs check` o reprova, e o build falha na validação de packs, não na
# resolução de dependências. Nunca entra no PACKS default.
[project]
name = "incompatible-pack"
version = "0.1.0"
description = "Pack incompatível de propósito: prova que o build da instalação o recusa."
requires-python = ">=3.12"
dependencies = ["axon-ai-contracts>=0.2,<0.4"]

[project.entry-points."axon.packs"]
incompatible = "incompatible_pack:IncompatiblePack"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
