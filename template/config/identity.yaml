# Clientes do provedor de identidade da plataforma (spec 012, contracts/identity-yaml.md). Vai para a imagem; vale com
# AXON_IDENTITY_ENABLED=true. Os endereços de retorno são comparados byte a byte: troque os de exemplo pelos domínios
# desta instalação (os mesmos de AXON_PUBLIC_URL e AXON_CHAT_URL). Nenhum segredo aqui: `secret` é o nome do sufixo de
# AXON_IDENTITY_SECRET_<NOME>, lido do ambiente.
version: 1
clients:
  # O Open WebUI (perfil webui): confidencial; os tokens dele valem só no chat (/v1, audiência axon).
  open-webui:
    type: confidential
    secret: open_webui
    audience: axon
    redirect_uris:
      - https://chat.exemplo.org/oauth/oidc/callback
      - http://localhost:3000/oauth/oidc/callback
    post_logout_redirect_uris:
      - https://chat.exemplo.org/auth
      - http://localhost:3000/auth
  # A console de administração (perfil console): pública, com PKCE; os tokens dela valem só em /admin/v1 (axon-admin).
  console:
    type: public
    audience: axon-admin
    redirect_uris:
      - https://axon.exemplo.org/callback
      - http://localhost:8080/callback
    post_logout_redirect_uris:
      - https://axon.exemplo.org/
      - http://localhost:8080/
