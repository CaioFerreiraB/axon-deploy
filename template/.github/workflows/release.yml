# Release desta instalação (spec 002; ADR-042, item 6): cada push na branch principal, ou tag, constrói a imagem sobre
# as imagens base da plataforma e a publica no registry da instalação. O compose referencia a tag; atualizar o deploy
# é um commit que troca a tag no compose.yml.
#
# Imagens base privadas: nos pacotes axon-build e axon-runtime do GHCR, "Manage Actions access" dá a este repositório
# leitura, e o GITHUB_TOKEN basta para baixá-las e para publicar a imagem desta instalação.
# Segredo do repositório:
#   PACKS_DEPLOY_KEY  chave SSH só de leitura dos repositórios de packs privados (sem pack privado, não cadastre)
# Os packs são os do `ARG PACKS` do Dockerfile: a fonte única, para o CI e o build local darem a mesma imagem.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Entrar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Gravar a chave dos packs
        id: keys
        env:
          PACKS_DEPLOY_KEY: ${{ secrets.PACKS_DEPLOY_KEY }}
        run: |
          [[ -z "$PACKS_DEPLOY_KEY" ]] && exit 0
          install -d -m 700 "$RUNNER_TEMP/keys"
          printf '%s\n' "$PACKS_DEPLOY_KEY" > "$RUNNER_TEMP/keys/packs"
          chmod 600 "$RUNNER_TEMP/keys/packs"
          echo "ssh=packs=$RUNNER_TEMP/keys/packs" >> "$GITHUB_OUTPUT"
      - name: Tags da imagem
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:sha-${GITHUB_SHA::7}"
          [[ "$GITHUB_REF_TYPE" == tag ]] && tags="$tags,$image:${GITHUB_REF_NAME#v}"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          ssh: ${{ steps.keys.outputs.ssh }}
      - name: Apagar a chave
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
