# Para rodar na máquina do operador (spec 002 FR-033): build local da imagem da instalação, portas no host e uma rede
# de proxy própria, criada pelo compose.
#   docker compose -f compose.yml -f compose.local.yml up --build
# Os packs são os do `ARG PACKS` do Dockerfile; a identidade SSH `packs` só é necessária com packs privados (o agente
# SSH responde por ela). Com `COMPOSE_FILE=compose.yml:compose.local.yml` no .env, basta `docker compose up --build`.
services:
  axon:
    image: axon-instalacao:local
    build:
      context: .
      ssh:
        - packs=${SSH_AUTH_SOCK:-}
    ports:
      - "${AXON_HOST_PORT:-8000}:8000"
  console:
    ports:
      - "${CONSOLE_HOST_PORT:-8080}:8080"
  open-webui:
    ports:
      - "${OPEN_WEBUI_HOST_PORT:-3000}:8080"

networks:
  proxy:
    external: false
    name: axon-local-proxy
